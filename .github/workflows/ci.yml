name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # DB가 필요한 테스트(test/api/*)와 빌드가 쓰는 Postgres. resetDb는 이름에 "test"가 든 DB만 비운다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pocaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # postinstall의 prisma generate와 migrate deploy는 prisma.config.ts의 DIRECT_URL을 쓴다.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pocaz_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pocaz_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pocaz_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Next 서버(빌드 포함)는 Node에서 돈다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and format (Biome)
        run: bun run check
      - name: Migrate test database
        run: bunx prisma migrate deploy
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
        env:
          # 빌드는 Supabase에 접속하지 않는다. 모듈을 불러올 때 클라이언트를 만드는 코드 때문에 자리표시 값만 채운다.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
